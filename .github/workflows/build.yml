name: Build Put APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project from put-app.zip
        run: |
          rm -rf proj && mkdir proj
          unzip -q -o put-app.zip -d proj
          cd proj
          if [ ! -f settings.gradle ] && [ "$(ls | wc -l)" = "1" ]; then
            shopt -s dotglob; inner=$(ls); mv "$inner"/* . ; rmdir "$inner"
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/*.apk out/Put.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Put-apk
          path: out/Put.apk
